name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_saas?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones contra Postgres de CI
        run: pnpm --filter @pos/database exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
